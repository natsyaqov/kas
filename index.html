  /* ===== Mode gelap ===== */
  html.dark{color-scheme:dark}
  html.dark body{background:#0b1220;color:#e2e8f0}

  html.dark .hover\:bg-slate-50:hover,html.dark .hover\:bg-slate-50\/80:hover{background-color:#1a2740}
  html.dark .hover\:bg-slate-200:hover{background-color:#2c3c5a}
  html.dark .bg-emerald-50{background-color:rgba(16,185,129,.12)}
  html.dark .bg-rose-50{background-color:rgba(244,63,94,.12)}
  html.dark .bg-emerald-100{background-color:rgba(16,185,129,.2)}
  html.dark .bg-rose-100{background-color:rgba(244,63,94,.2)}
  html.dark .bg-slate-900{background-color:#2563eb}
  html.dark .hover\:bg-slate-800:hover{background-color:#1d4ed8}
  html.dark .border-slate-50,html.dark .border-slate-100,html.dark .border-slate-200{border-color:#26344d}
  html.dark .border-emerald-100\/50,html.dark .border-rose-100\/50{border-color:transparent}
  html.dark .divide-slate-50>:not([hidden])~:not([hidden]){border-color:#26344d}
  html.dark .text-slate-900,html.dark .text-slate-800{color:#f1f5f9}
  html.dark .text-slate-700{color:#e2e8f0}
  html.dark .text-slate-600,html.dark .hover\:text-slate-700:hover{color:#cbd5e1}
  html.dark .text-slate-500{color:#94a3b8}
  html.dark .text-slate-400,html.dark .text-slate-300{color:#7c8ba3}
  html.dark .text-emerald-600,html.dark .text-emerald-700{color:#34d399}

  html.dark .text-blue-600,html.dark .hover\:text-blue-700:hover{color:#60a5fa}

  /* Laporan cetak */
  #laporan{display:none;color:#000;background:#fff;padding:24px;max-width:720px;margin:0 auto}
  #laporan h1{color:#000;font-size:1.4rem;margin:0}

  #laporan table{width:100%;border-collapse:collapse;font-size:.9rem}
  #laporan td,#laporan th{padding:8px 6px;border-bottom:1px solid #ccc;text-align:left}

  @media print{
    body.cetak main{display:none}
    body.cetak #laporan{display:block}
    body,html.dark body{background:#fff;color:#000}
  }
</style>

      </div>
      <div>
        <h1 id="judul" class="text-xl font-extrabold text-slate-800 tracking-tight">KAS RT</h1>

  <!-- Box Grafik -->

    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none transition-all">

  <!-- Form Transaksi -->
  <div id="form" class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 sm:p-6 mb-6" hidden>

      <select id="kategori" aria-label="Kategori" class="col-span-1 sm:col-span-2 w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none"></select>
      <input id="ket" type="text" placeholder="Keterangan, misal: Iuran keamanan Pak Budi" aria-label="Keterangan" class="col-span-1 sm:col-span-2 w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none">
      <input id="jumlah" type="text" inputmode="numeric" autocomplete="off" placeholder="Jumlah (Rp), contoh: 50.000" aria-label="Jumlah" class="col-span-1 sm:col-span-2 w-full px-4 py-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none font-bold text-xl text-slate-800">

      <button id="tambah" class="col-span-1 sm:col-span-2 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition-all duration-200 active:scale-[0.98] disabled:opacity-50">Tambah transaksi</button>

    </div>

  <!-- Judul, pencarian, filter bulan -->
  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-4 mt-8">

    <div class="flex flex-col min-[400px]:flex-row gap-2 w-full sm:w-auto">
      <input id="cari" type="text" placeholder="Cari transaksi..." class="w-full sm:w-48 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
      <select id="bulan" aria-label="Filter bulan" class="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
        <option value="">Semua bulan</option>
      </select>
    </div>
  </div>

  <!-- Cetak & Excel (khusus bendahara) -->
  <div id="boxCetak" class="flex gap-3 mb-5" hidden>
    <button id="cetak" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold py-2.5 px-3 rounded-xl shadow-sm transition-all duration-200 active:scale-95 text-center">🖨️ Cetak Laporan</button>
    <button id="export" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold py-2.5 px-3 rounded-xl shadow-sm transition-all duration-200 active:scale-95 text-center">📊 Export Excel</button>

  <!-- Chip filter kategori -->
  <div id="chips" class="flex gap-2 overflow-x-auto noscroll mb-4" hidden></div>

    <button id="btnRiwayat" class="text-xs font-semibold text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-5 py-2.5 rounded-full transition-all duration-200 active:scale-95">Lihat riwayat sistem</button>

<script>
// ====== ISI BAGIAN INI ======
var SUPABASE_URL = 'https://jfluvtgiyachbwrbstow.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_rrcjWfQGPCG-mbXwaDt0-w_-CJhKP4H';
var NAMA_RT = 'RT 007 / RW 003';
var KAT = {
  masuk: ['Iuran keamanan','Iuran kebersihan','Kas sosial','Sumbangan','Lainnya'],
  keluar: ['Gaji satpam','Petugas sampah','Listrik & air pos ronda','Santunan warga','Kegiatan warga','Perlengkapan','Lainnya']
};
// Ikon tiap kategori. Kalau kamu menambah kategori baru, tambahkan juga di sini.
var IKON = {
  'Iuran keamanan':'🛡️','Iuran kebersihan':'🧹','Kas sosial':'💝','Sumbangan':'🎁',
  'Gaji satpam':'👮','Petugas sampah':'🗑️','Listrik & air pos ronda':'💡',
  'Santunan warga':'🤝','Kegiatan warga':'🎉','Perlengkapan':'🧰','Lainnya':'📌'
};
// ============================

var $ = function(id){ return document.getElementById(id); };
var rp = function(n){ return (n<0?'-':'') + 'Rp ' + Math.abs(n).toLocaleString('id-ID'); };
var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var namaBulan = function(ym){ var p = ym.split('-'); return BULAN[+p[1]-1] + ' ' + p[0]; };
var tglIndo = function(s){ return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
var ribuan = function(v){ var d = String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,''); return d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); };
var ikon = function(k){ return IKON[k] || '📌'; };

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var data = [], saldoAwal = 0, loggedIn = false, editId = null, katAktif = '';
$('judul').textContent = 'KAS ' + NAMA_RT.split('/')[0].trim();
$('tanggal').value = new Date().toISOString().slice(0,10);

/* ===== Tema gelap/terang ===== */
var isDark = function(){ return document.documentElement.classList.contains('dark'); };
function setTema(d){
  document.documentElement.classList.toggle('dark', d);
  try { localStorage.setItem('tema', d ? 'dark' : 'light'); } catch(e){}
  $('btnTema').textContent = d ? '☀️' : '🌙';
  document.querySelector('meta[name=theme-color]').content = d ? '#0b1220' : '#2563eb';
  if(myChart){ myChart.destroy(); myChart = null; }
}
$('btnTema').textContent = isDark() ? '☀️' : '🌙';
$('btnTema').onclick = function(){ setTema(!isDark()); render(); };

/* ===== Form ===== */
function isiKategori(pilih){
  var sel = $('kategori'), list = KAT[$('jenis').value].slice();
  if(pilih && list.indexOf(pilih) < 0) list.push(pilih);
  sel.innerHTML = '';
  list.forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = ikon(k) + ' ' + k; sel.appendChild(o); });
  if(pilih) sel.value = pilih;
}
$('jenis').onchange = function(){ isiKategori(); };
$('jumlah').addEventListener('input', function(){ this.value = ribuan(this.value); });
isiKategori();

/* ===== Penyaringan data ===== */
// Hanya per bulan (dipakai untuk kartu total, grafik, laporan, Excel, dan WhatsApp)
function rowsBulan(){
  var b = $('bulan').value;
  return b ? data.filter(function(t){ return t.tanggal.slice(0,7) === b; }) : data.slice();
}
// Bulan + kategori + pencarian (khusus untuk daftar yang tampil)
function filtered(){
  var q = $('cari').value.toLowerCase().trim();
  var res = rowsBulan();
  if(katAktif) res = res.filter(function(t){ return t.kategori === katAktif; });
  if(q) res = res.filter(function(t){ return t.ket.toLowerCase().indexOf(q) > -1 || t.kategori.toLowerCase().indexOf(q) > -1; });
  return res;
}

function renderBulan(){
  var sel = $('bulan'), cur = sel.value, set = {};
  data.forEach(function(t){ set[t.tanggal.slice(0,7)] = 1; });
  var list = Object.keys(set).sort().reverse();
  sel.innerHTML = '<option value="">Semua bulan</option>';
  list.forEach(function(ym){ var o = document.createElement('option'); o.value = ym; o.textContent = namaBulan(ym); sel.appendChild(o); });
  sel.value = list.indexOf(cur) >= 0 ? cur : '';
}

function renderChips(){
  var box = $('chips'), set = {};
  rowsBulan().forEach(function(t){ set[t.kategori] = 1; });
  var cats = Object.keys(set).sort();
  if(katAktif && !set[katAktif]) katAktif = '';
  box.innerHTML = '';
  box.hidden = cats.length < 2;
  [''].concat(cats).forEach(function(k){
    var b = document.createElement('button');
    b.className = 'shrink-0 text-xs font-semibold px-3.5 py-2 rounded-full border transition-all duration-200 active:scale-95 ' +
      (k === katAktif ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white border-slate-200 text-slate-600');
    b.textContent = k ? ikon(k) + ' ' + k : 'Semua';
    b.onclick = function(){ katAktif = k; render(); };
    box.appendChild(b);
  });
}

function formatGrupTanggal(tgl) {
  var hariIni = new Date().toISOString().slice(0,10);
  var kemarin = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (tgl === hariIni) return 'HARI INI';
  if (tgl === kemarin) return 'KEMARIN';
  return tglIndo(tgl).toUpperCase();
}

/* ===== Grafik ===== */
var myChart = null;
function updateChart(rows) {
  var kats = {}, totalKeluar = 0;
  rows.forEach(function(t){
    if(t.jenis === 'keluar') { kats[t.kategori] = (kats[t.kategori] || 0) + t.jumlah; totalKeluar += t.jumlah; }
  });
  if(totalKeluar === 0) { $('boxChart').hidden = true; return; }
  $('boxChart').hidden = false;

  var labels = Object.keys(kats);
  var dataVals = Object.values(kats);
  var colors = ['#f43f5e', '#f97316', '#eab308', '#84cc16', '#06b6d4', '#8b5cf6', '#ec4899'];

  if(myChart) {
    myChart.data.labels = labels;
    myChart.data.datasets[0].data = dataVals;
    myChart.update();
  } else {
    var ctx = $('chartPengeluaran').getContext('2d');
    myChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: dataVals, backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }] },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { color: isDark() ? '#cbd5e1' : '#475569', boxWidth: 12, font: { size: 11, family: "'Inter', sans-serif" } } },
          tooltip: { callbacks: { label: function(c){ return ' ' + c.label + ': Rp ' + c.raw.toLocaleString('id-ID'); } } }
        },
        cutout: '65%'
      }
    });
  }
}

/* ===== Tampilan utama ===== */
function render(msg){
  var total = saldoAwal;
  data.forEach(function(t){ total += t.jenis==='masuk' ? t.jumlah : -t.jumlah; });
  $('saldo').textContent = rp(total);
  $('infoAwal').hidden = !saldoAwal;
  $('infoAwal').textContent = 'Termasuk saldo awal ' + rp(saldoAwal);

  var bulanRows = rowsBulan(), m = 0, k = 0;
  bulanRows.forEach(function(t){ if(t.jenis==='masuk') m += t.jumlah; else k += t.jumlah; });
  $('totalMasuk').textContent = rp(m);
  $('totalKeluar').textContent = rp(k);

  var lbl = $('bulan').value ? namaBulan($('bulan').value) : 'Semua Periode';
  $('lblPeriodeMasuk').textContent = 'Pemasukan ' + lbl;
  $('lblPeriodeKeluar').textContent = 'Pengeluaran ' + lbl;

  updateChart(bulanRows);
  renderChips();

  var rows = filtered();
  var ul = $('daftar'); ul.innerHTML = '';

  if(!rows.length){
    var e = document.createElement('li');
    e.className = 'py-12 px-6 flex flex-col items-center justify-center text-center bg-slate-50/50';
    e.innerHTML = '<div class="text-5xl mb-3">🗂️</div><p class="text-slate-500 font-medium text-sm">' + (msg || 'Tidak ada transaksi ditemukan.') + '</p>';
    ul.appendChild(e); return;
  }

  var lastDate = null;
  rows.forEach(function(t){
    if (t.tanggal !== lastDate) {
      var hd = document.createElement('li');
      hd.className = 'bg-slate-50/80 px-5 py-2.5 text-[11px] font-bold text-slate-500 tracking-widest border-y border-slate-100';
      hd.textContent = formatGrupTanggal(t.tanggal);
      ul.appendChild(hd);
      lastDate = t.tanggal;
    }
    var li = document.createElement('li');
    li.className = 'p-4 sm:px-5 flex items-center justify-between hover:bg-slate-50/80 transition-colors border-b border-slate-50 last:border-0';
    var leftBox = document.createElement('div');
    leftBox.className = 'flex items-center gap-3.5 min-w-0';
    var icon = document.createElement('div');
    icon.className = (t.jenis === 'masuk' ? 'bg-emerald-100' : 'bg-rose-100') + ' w-10 h-10 rounded-full flex items-center justify-center text-lg shrink-0';
    icon.textContent = ikon(t.kategori);
    var ket = document.createElement('div');
    ket.className = 'flex-1 min-w-0';
    var a = document.createElement('p');
    a.className = 'font-semibold text-slate-800 text-sm truncate';
    a.textContent = t.ket;
    var d = document.createElement('p');
    d.className = 'text-xs text-slate-500 mt-0.5 truncate';
    d.textContent = t.kategori;
    ket.appendChild(a); ket.appendChild(d);
    leftBox.appendChild(icon); leftBox.appendChild(ket);

    var rightBox = document.createElement('div');
    rightBox.className = 'text-right shrink-0 ml-3';
    var j = document.createElement('p');
    j.className = 'font-bold text-sm sm:text-base tracking-tight ' + (t.jenis==='masuk'?'text-emerald-600':'text-rose-600');
    j.textContent = (t.jenis==='masuk'?'+':'−') + rp(t.jumlah);
    rightBox.appendChild(j);

    if(loggedIn){
      var ak = document.createElement('div');
      ak.className = 'flex gap-3 mt-1.5 justify-end';
      var ed = document.createElement('button');
      ed.className = 'text-[11px] font-bold text-blue-600 hover:text-blue-800 uppercase tracking-wider active:scale-90 transition-transform';
      ed.textContent = 'Edit';
      ed.onclick = function(){ mulaiEdit(t); };
      var h = document.createElement('button');
      h.className = 'text-[11px] font-bold text-rose-600 hover:text-rose-800 uppercase tracking-wider active:scale-90 transition-transform';
      h.textContent = 'Hapus';
      h.onclick = function(){
        if(!confirm('Hapus transaksi “' + t.ket + '”?')) return;
        sb.from('kas').delete().eq('id', t.id).then(function(r){
          if(r.error) alert('Gagal menghapus: ' + r.error.message); else load();
        });
      };
      ak.appendChild(ed); ak.appendChild(h); rightBox.appendChild(ak);
    }
    li.appendChild(leftBox); li.appendChild(rightBox);
    ul.appendChild(li);
  });
}

function load(){
  if(!$('riwayat').hidden) loadRiwayat();
  Promise.all([
    sb.from('kas').select('*').order('tanggal',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('pengaturan').select('saldo_awal').eq('id',1).maybeSingle()
  ]).then(function(res){
    var r = res[0], p = res[1];
    if(r.error){ data = []; render('Data gagal dimuat. Cek pengaturan Supabase.'); return; }
    data = r.data.map(function(t){ t.kategori = t.kategori || 'Lainnya'; return t; });
    saldoAwal = (p && p.data && p.data.saldo_awal) ? Number(p.data.saldo_awal) : 0;
    renderBulan(); render();
  });
}

/* ===== Login ===== */
function setAuth(session){
  loggedIn = !!session;
  $('boxRiwayat').hidden = !loggedIn;
  if(!loggedIn){ $('riwayat').hidden = true; $('btnRiwayat').textContent = 'Lihat riwayat sistem'; }
  $('form').hidden = !loggedIn;
  $('btnAwal').hidden = !loggedIn;
  $('boxCetak').hidden = !loggedIn;
  $('loginBox').hidden = true;
  $('btnLogin').textContent = loggedIn ? 'Keluar' : 'Login';
  if(!loggedIn) selesaiEdit();
  render();
}

$('btnLogin').onclick = function(){
  if(loggedIn){
    sb.auth.signOut({ scope: 'local' }).then(function(){ setAuth(null); });
  } else {
    $('loginBox').hidden = !$('loginBox').hidden;
  }
};
$('doLogin').onclick = function(){
  var btn = $('doLogin'); btn.textContent = 'Loading...'; btn.disabled = true;
  sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value }).then(function(r){
    btn.textContent = 'Masuk'; btn.disabled = false;
    if(r.error) alert('Login gagal: email atau password salah.'); else $('pass').value = '';
  });
};
function tekanEnter(e) { if (e.key === 'Enter') $('doLogin').click(); }
$('email').addEventListener('keypress', tekanEnter);
$('pass').addEventListener('keypress', tekanEnter);

sb.auth.onAuthStateChange(function(_e, session){ setAuth(session); });
$('bulan').onchange = function(){ render(); };
$('cari').oninput = function(){ render(); };

/* ===== Tambah / edit / saldo awal ===== */
function mulaiEdit(t){
  editId = t.id;
  $('jenis').value = t.jenis; isiKategori(t.kategori);
  $('tanggal').value = t.tanggal; $('ket').value = t.ket; $('jumlah').value = ribuan(t.jumlah);
  $('formTitle').textContent = 'Edit Transaksi';
  $('tambah').textContent = 'Simpan perubahan'; $('batal').hidden = false;
  $('form').scrollIntoView({behavior:'smooth', block:'center'});
}
function selesaiEdit(){
  editId = null;
  $('ket').value = ''; $('jumlah').value = '';
  $('formTitle').textContent = 'Catat Transaksi';
  $('tambah').textContent = 'Tambah transaksi'; $('batal').hidden = true;
}
$('batal').onclick = selesaiEdit;

$('tambah').onclick = function(){
  var jumlah = parseInt($('jumlah').value.replace(/\D/g,''), 10), ket = $('ket').value.trim();
  if(!ket || !jumlah || jumlah <= 0 || !$('tanggal').value){ alert('Isi tanggal, keterangan, dan jumlah dulu ya.'); return; }
  var payload = { jenis: $('jenis').value, tanggal: $('tanggal').value, kategori: $('kategori').value, ket: ket, jumlah: jumlah };
  var btn = $('tambah'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  var q = editId ? sb.from('kas').update(payload).eq('id', editId) : sb.from('kas').insert(payload);
  q.then(function(r){
    btn.disabled = false;
    if(r.error){ alert('Gagal menyimpan: ' + r.error.message); btn.textContent = editId ? 'Simpan perubahan' : 'Tambah transaksi'; return; }
    selesaiEdit(); load();
  });
};

$('btnAwal').onclick = function(){
  var v = prompt('Saldo awal kas (Rp):', saldoAwal);
  if(v === null) return;
  var n = parseInt(String(v).replace(/[^\d-]/g,''), 10);
  if(isNaN(n)){ alert('Masukkan angka saja.'); return; }
  sb.from('pengaturan').upsert({ id: 1, saldo_awal: n }).then(function(r){
    if(r.error) alert('Gagal menyimpan: ' + r.error.message); else load();
  });
};

/* ===== Hitungan bantu ===== */
function saldoSebelum(ym){
  var s = saldoAwal;
  data.forEach(function(t){ if(t.tanggal.slice(0,7) < ym) s += t.jenis==='masuk' ? t.jumlah : -t.jumlah; });
  return s;
}
function perKategori(rows, jenis){
  var map = {}, total = 0;
  rows.forEach(function(t){ if(t.jenis===jenis){ map[t.kategori] = (map[t.kategori]||0) + t.jumlah; total += t.jumlah; } });
  return { map: map, total: total };
}

/* ===== Bagikan ke WhatsApp ===== */
$('btnWA').onclick = function(){
  var ym = $('bulan').value, rows = rowsBulan();
  var awal = ym ? saldoSebelum(ym) : saldoAwal;
  var pm = perKategori(rows,'masuk'), pk = perKategori(rows,'keluar');
  var akhir = awal + pm.total - pk.total;
  var t = '*Laporan Kas ' + NAMA_RT + '*\nPeriode: ' + (ym ? namaBulan(ym) : 'Semua periode') +
    '\n\nSaldo awal: ' + rp(awal) + '\nPemasukan: ' + rp(pm.total) + '\nPengeluaran: ' + rp(pk.total) +
    '\n*Saldo akhir: ' + rp(akhir) + '*';
  var top = Object.keys(pk.map).map(function(k){ return [k, pk.map[k]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);
  if(top.length){
    t += '\n\nPengeluaran terbesar:';
    top.forEach(function(x,i){ t += '\n' + (i+1) + '. ' + x[0] + ': ' + rp(x[1]); });
  }
  t += '\n\nRincian lengkap: ' + location.href.split('#')[0].split('?')[0];
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
};

/* ===== Export Excel & cetak laporan ===== */
$('export').onclick = function(){
  var rows = rowsBulan().sort(function(a,b){ return a.tanggal.localeCompare(b.tanggal) || a.created_at.localeCompare(b.created_at); });
  var b = $('bulan').value;
  var saldo = b ? saldoSebelum(b) : saldoAwal;
  var aoa = [['Tanggal','Kategori','Keterangan','Pemasukan','Pengeluaran','Saldo']];
  aoa.push(['', '', b ? 'Saldo awal periode' : 'Saldo awal', '', '', saldo]);
  rows.forEach(function(t){
    saldo += t.jenis==='masuk' ? t.jumlah : -t.jumlah;
    aoa.push([t.tanggal, t.kategori, t.ket, t.jenis==='masuk'?t.jumlah:'', t.jenis==='keluar'?t.jumlah:'', saldo]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:12},{wch:22},{wch:36},{wch:14},{wch:14},{wch:14}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Kas');
  XLSX.writeFile(wb, 'kas-' + (b || 'semua') + '.xlsx');
};

$('cetak').onclick = function(){
  var ym = $('bulan').value;
  if(!ym){ alert('Pilih bulan dulu di filter riwayat transaksi, lalu klik Cetak Laporan.'); return; }
  var rows = rowsBulan().sort(function(a,b){ return a.tanggal.localeCompare(b.tanggal) || a.created_at.localeCompare(b.created_at); });
  var awal = saldoSebelum(ym), pm = perKategori(rows,'masuk'), pk = perKategori(rows,'keluar');
  var akhir = awal + pm.total - pk.total;

  function tabel(judul, o){
    var h = '<h3>' + judul + '</h3><table>';
    var keys = Object.keys(o.map);
    if(!keys.length) h += '<tr><td>Tidak ada</td><td class="r">Rp0</td></tr>';
    keys.forEach(function(k){ h += '<tr><td>' + esc(k) + '</td><td class="r">' + rp(o.map[k]) + '</td></tr>'; });
    return h + '<tr class="tot"><td>Total</td><td class="r">' + rp(o.total) + '</td></tr></table>';
  }
  var h = '<h1>Laporan Kas ' + esc(NAMA_RT) + '</h1><p class="sub">Periode ' + namaBulan(ym) + '</p>';
  h += '<h3>Ringkasan</h3><table>' +
       '<tr><td>Saldo awal bulan</td><td class="r">' + rp(awal) + '</td></tr>' +
       '<tr><td>Total pemasukan</td><td class="r">' + rp(pm.total) + '</td></tr>' +
       '<tr><td>Total pengeluaran</td><td class="r">' + rp(pk.total) + '</td></tr>' +
       '<tr class="tot"><td>Saldo akhir bulan</td><td class="r">' + rp(akhir) + '</td></tr></table>';
  h += tabel('Pemasukan per kategori', pm) + tabel('Pengeluaran per kategori', pk);
  h += '<h3>Rincian transaksi</h3><table><tr><th>Tanggal</th><th>Keterangan</th><th class="r">Pemasukan</th><th class="r">Pengeluaran</th></tr>';
  rows.forEach(function(t){
    h += '<tr><td>' + tglIndo(t.tanggal) + '</td><td>' + esc(t.ket) + ' (' + esc(t.kategori) + ')</td>' +
         '<td class="r">' + (t.jenis==='masuk' ? rp(t.jumlah) : '') + '</td>' +
         '<td class="r">' + (t.jenis==='keluar' ? rp(t.jumlah) : '') + '</td></tr>';
  });
  h += '</table><p class="sub" style="margin-top:28px">Dicetak ' + tglIndo(new Date().toISOString().slice(0,10)) + '</p>';
  $('laporan').innerHTML = h;
  document.body.classList.add('cetak');
  window.print();
};
window.addEventListener('afterprint', function(){ document.body.classList.remove('cetak'); });

/* ===== Riwayat sistem ===== */
var FIELD = { jenis:'jenis', tanggal:'tanggal', kategori:'kategori', ket:'keterangan', jumlah:'jumlah' };
function fmtVal(k, v){
  if(k === 'jumlah') return rp(Number(v));
  if(k === 'tanggal') return tglIndo(v);
  if(k === 'jenis') return v === 'masuk' ? 'pemasukan' : 'pengeluaran';
  return '“' + v + '”';
}
function uraian(r){
  var b = r.data_baru, l = r.data_lama;
  if(r.aksi === 'tambah') return 'Menambah ' + (b.jenis==='masuk'?'pemasukan':'pengeluaran') + ' “' + b.ket + '” (' + (b.kategori||'Lainnya') + ') ' + rp(b.jumlah);
  if(r.aksi === 'hapus') return 'Menghapus ' + (l.jenis==='masuk'?'pemasukan':'pengeluaran') + ' “' + l.ket + '” (' + (l.kategori||'Lainnya') + ') ' + rp(l.jumlah);
  if(r.aksi === 'saldo_awal') return l ? 'Mengubah saldo awal dari ' + rp(Number(l.saldo_awal)) + ' menjadi ' + rp(Number(b.saldo_awal)) : 'Mengatur saldo awal ' + rp(Number(b.saldo_awal));
  var beda = [];
  Object.keys(FIELD).forEach(function(k){
    if(l[k] !== b[k]) beda.push(FIELD[k] + ' ' + fmtVal(k, l[k]) + ' → ' + fmtVal(k, b[k]));
  });
  return 'Mengubah “' + l.ket + '”: ' + (beda.length ? beda.join('; ') : 'tanpa perubahan isi');
}
function loadRiwayat(){
  sb.from('riwayat').select('*').order('waktu',{ascending:false}).limit(50).then(function(r){
    var ul = $('riwayat'); ul.innerHTML = '';
    if(r.error){
      var e = document.createElement('li'); e.className = 'p-6 text-center text-slate-400 text-sm';
      e.textContent = 'Riwayat gagal dimuat.';
      ul.appendChild(e); return;
    }
    if(!r.data.length){
      var k = document.createElement('li'); k.className = 'p-6 text-center text-slate-400 text-sm';
      k.textContent = 'Belum ada perubahan tercatat.';
      ul.appendChild(k); return;
    }
    r.data.forEach(function(x){
      var li = document.createElement('li');
      li.className = 'p-4 flex flex-col hover:bg-slate-50/50';
      var a = document.createElement('p'); a.className = 'text-sm text-slate-700 font-medium mb-1'; a.textContent = uraian(x);
      var d = document.createElement('p'); d.className = 'text-[11px] text-slate-400';
      var oleh = x.email ? x.email.split('@')[0] : 'bendahara';
      d.textContent = new Date(x.waktu).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) + ' • ' + oleh;
      li.appendChild(a); li.appendChild(d); ul.appendChild(li);
    });
  });
}
$('btnRiwayat').onclick = function(){
  var ul = $('riwayat');
  ul.hidden = !ul.hidden;
  $('btnRiwayat').textContent = ul.hidden ? 'Lihat riwayat sistem' : 'Sembunyikan riwayat sistem';
  if(!ul.hidden) loadRiwayat();
};

/* ===== Pasang di HP (PWA) ===== */
var promptPasang = null;
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); promptPasang = e; });
if(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) $('boxPasang').hidden = true;
$('btnPasang').onclick = function(){
  if(promptPasang){ promptPasang.prompt(); promptPasang = null; return; }

};
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

load();
setInterval(load, 30000);
