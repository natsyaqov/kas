<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAS RT</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  /* Laporan cetak */
  #laporan{display:none;color:#000;background:#fff;padding:24px;max-width:720px;margin:0 auto}
  #laporan h1{color:#000;font-size:1.4rem;margin:0}
  #laporan h3{margin:20px 0 6px;font-size:1rem}
  #laporan table{width:100%;border-collapse:collapse;font-size:.9rem}
  #laporan td,#laporan th{padding:8px 6px;border-bottom:1px solid #ccc;text-align:left}
  #laporan td.r,#laporan th.r{text-align:right}
  #laporan .tot td{font-weight:700;border-top:2px solid #000}
  #laporan .sub{color:#444;margin:2px 0 0}
  @media print{
    body.cetak main{display:none}
    body.cetak #laporan{display:block}
    body{background:#fff}
  }
</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
<main class="max-w-xl mx-auto p-4 sm:p-6 pb-24">
  
  <!-- 1. Header yang Lebih Personal & Bernyawa -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-md">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      </div>
      <div>
        <h1 id="judul" class="text-xl font-extrabold text-slate-800 tracking-tight">KAS RT</h1>
        <p class="text-xs text-slate-500 font-medium">Transparan & Terpercaya</p>
      </div>
    </div>
    <!-- 2. Micro-interaction: active:scale-95 agar membal saat disentuh -->
    <button id="btnLogin" class="text-xs font-semibold text-slate-600 hover:text-blue-700 bg-white border border-slate-200 shadow-sm px-4 py-2.5 rounded-full transition-all duration-200 active:scale-95">Login</button>
  </div>

  <!-- Card Saldo Utama -->
  <section class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 mb-6 text-center" aria-live="polite">
    <p class="text-sm text-slate-500 font-medium mb-1">Total Saldo Kas</p>
    <h2 id="saldo" class="text-4xl sm:text-5xl font-bold text-slate-900 tracking-tight mb-2 transition-all">Rp0</h2>
    <p id="infoAwal" class="text-xs text-slate-400" hidden></p>
    
    <div class="grid grid-cols-2 gap-3 mt-6 pt-5 border-t border-slate-100 text-left">
      <div class="bg-emerald-50 rounded-2xl p-4 border border-emerald-100/50">
        <p id="lblPeriodeMasuk" class="text-xs text-emerald-600 font-semibold mb-1">Pemasukan</p>
        <p id="totalMasuk" class="text-lg sm:text-xl font-bold text-emerald-700">Rp0</p>
      </div>
      <div class="bg-rose-50 rounded-2xl p-4 border border-rose-100/50">
        <p id="lblPeriodeKeluar" class="text-xs text-rose-600 font-semibold mb-1">Pengeluaran</p>
        <p id="totalKeluar" class="text-lg sm:text-xl font-bold text-rose-700">Rp0</p>
      </div>
    </div>
    <div class="mt-4">
      <button id="btnAwal" class="text-xs text-slate-400 underline hover:text-slate-600 transition-colors" hidden>Atur saldo awal</button>
    </div>
  </section>

  <!-- Box Login -->
  <div id="loginBox" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-6 space-y-3" hidden>
    <h3 class="font-semibold text-slate-700 mb-2">Login Bendahara</h3>
    <input id="email" type="email" placeholder="Email bendahara" autocomplete="username" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none transition-all">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none transition-all">
    <button id="doLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition-all duration-200 active:scale-[0.98] mt-2">Masuk</button>
  </div>

  <!-- Form Transaksi -->
  <div id="form" class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 sm:p-6 mb-6" hidden>
    <h3 class="font-bold text-slate-800 mb-4" id="formTitle">Catat Transaksi</h3>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <select id="jenis" aria-label="Jenis" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none font-medium">
        <option value="masuk">Pemasukan (+)</option>
        <option value="keluar">Pengeluaran (-)</option>
      </select>
      <input id="tanggal" type="date" aria-label="Tanggal" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none">
      <select id="kategori" aria-label="Kategori" class="col-span-1 sm:col-span-2 w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none"></select>
      <input id="ket" type="text" placeholder="Keterangan, misal: Iuran keamanan Pak Budi" aria-label="Keterangan" class="col-span-1 sm:col-span-2 w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none">
      <input id="jumlah" type="text" inputmode="numeric" autocomplete="off" placeholder="Jumlah (Rp), contoh: 50.000" aria-label="Jumlah" class="col-span-1 sm:col-span-2 w-full px-4 py-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none font-bold text-xl text-slate-800">
      
      <button id="tambah" class="col-span-1 sm:col-span-2 mt-2 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition-all duration-200 active:scale-[0.98] disabled:opacity-50">Tambah transaksi</button>
      <button id="batal" class="col-span-1 sm:col-span-2 mt-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold py-3 rounded-xl transition-all duration-200 active:scale-[0.98]" hidden>Batal edit</button>
    </div>
  </div>

  <!-- Aksi & Filter -->
  <div class="flex flex-wrap items-center justify-between gap-3 mb-4 mt-8">
    <h2 class="text-lg font-bold text-slate-800 flex-1 min-w-[120px]">Riwayat Transaksi</h2>
    <select id="bulan" aria-label="Filter bulan" class="px-4 py-2 rounded-xl border border-slate-200 bg-white text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none shadow-sm">
      <option value="">Semua bulan</option>
    </select>
  </div>
  
  <div class="flex gap-3 mb-5">
    <button id="cetak" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold py-2.5 px-3 rounded-xl shadow-sm transition-all duration-200 active:scale-95 text-center">🖨️ Cetak Laporan</button>
    <button id="export" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-semibold py-2.5 px-3 rounded-xl shadow-sm transition-all duration-200 active:scale-95 text-center">📊 Export Excel</button>
  </div>

  <!-- Daftar Transaksi -->
  <ul id="daftar" class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden"></ul>

  <!-- Log Riwayat -->
  <div class="text-center mt-10" id="boxRiwayat" hidden>
    <button id="btnRiwayat" class="text-xs font-semibold text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-5 py-2.5 rounded-full transition-all duration-200 active:scale-95">Lihat riwayat sistem</button>
  </div>
  <ul id="riwayat" class="mt-4 bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden divide-y divide-slate-50" hidden></ul>
</main>

<section id="laporan"></section>

<script>
// ====== ISI BAGIAN INI ======
var SUPABASE_URL = 'https://jfluvtgiyachbwrbstow.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_rrcjWfQGPCG-mbXwaDt0-w_-CJhKP4H';
var NAMA_RT = 'RT 007 / RW 003';
var KAT = {
  masuk: ['Iuran keamanan','Iuran kebersihan','Kas sosial','Sumbangan','Lainnya'],
  keluar: ['Gaji satpam','Petugas sampah','Listrik & air pos ronda','Santunan warga','Kegiatan warga','Perlengkapan','Lainnya']
};
// ============================

var $ = function(id){ return document.getElementById(id); };
var rp = function(n){ return (n<0?'-':'') + 'Rp ' + Math.abs(n).toLocaleString('id-ID'); };
var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var namaBulan = function(ym){ var p = ym.split('-'); return BULAN[+p[1]-1] + ' ' + p[0]; };
var tglIndo = function(s){ return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };

var ribuan = function(v){ var d = String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,''); return d.replace(/\B(?=(\d{3})+(?!\d))/g,'.'); };

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var data = [], saldoAwal = 0, loggedIn = false, editId = null;
$('judul').textContent = 'KAS ' + NAMA_RT.split('/')[0].trim(); // Disingkat agar header rapi$('tanggal').value = new Date().toISOString().slice(0,10);

function isiKategori(pilih){
  var sel = $('kategori'), list = KAT[$('jenis').value].slice();
  if(pilih && list.indexOf(pilih) < 0) list.push(pilih);
  sel.innerHTML = '';
  list.forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
  if(pilih) sel.value = pilih;
}
$('jenis').onchange = function(){ isiKategori(); };$('jumlah').addEventListener('input', function(){ this.value = ribuan(this.value); });
isiKategori();

function filtered(){
  var b = $('bulan').value;
  return b ? data.filter(function(t){ return t.tanggal.slice(0,7) === b; }) : data.slice();
}

function renderBulan(){
  var sel = $('bulan'), cur = sel.value, set = {};
  data.forEach(function(t){ set[t.tanggal.slice(0,7)] = 1; });
  var list = Object.keys(set).sort().reverse();
  sel.innerHTML = '<option value="">Semua bulan</option>';
  list.forEach(function(ym){ var o = document.createElement('option'); o.value = ym; o.textContent = namaBulan(ym); sel.appendChild(o); });
  sel.value = list.indexOf(cur) >= 0 ? cur : '';
}

var iconMasuk = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>';
var iconKeluar = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>';

// Fungsi untuk menentukan teks header grup tanggal
function formatGrupTanggal(tgl) {
  var hariIni = new Date().toISOString().slice(0,10);
  var kemarin = new Date(Date.now() - 86400000).toISOString().slice(0,10);
  if (tgl === hariIni) return 'HARI INI';
  if (tgl === kemarin) return 'KEMARIN';
  return tglIndo(tgl).toUpperCase();
}

function render(msg){
  var total = saldoAwal;
  data.forEach(function(t){ total += t.jenis==='masuk' ? t.jumlah : -t.jumlah; });
  $('saldo').textContent = rp(total);$('infoAwal').hidden = !saldoAwal;
  $('infoAwal').textContent = 'Termasuk saldo awal ' + rp(saldoAwal);

  var rows = filtered(), m = 0, k = 0;
  rows.forEach(function(t){ if(t.jenis==='masuk') m += t.jumlah; else k += t.jumlah; });
  $('totalMasuk').textContent = rp(m);$('totalKeluar').textContent = rp(k);
  
  var lbl = $('bulan').value ? namaBulan($('bulan').value) : 'Semua Periode';$('lblPeriodeMasuk').textContent = 'Pemasukan ' + lbl;
  $('lblPeriodeKeluar').textContent = 'Pengeluaran ' + lbl;

  var ul = $('daftar'); ul.innerHTML = '';
  
  // 4. Visualisasi Kosong (Empty States)
  if(!rows.length){
    var e = document.createElement('li'); 
    e.className = 'py-12 px-6 flex flex-col items-center justify-center text-center bg-slate-50/50';
    e.innerHTML = '<svg class="w-16 h-16 text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>' +
                  '<p class="text-slate-500 font-medium text-sm">' + (msg || 'Belum ada transaksi di periode ini.') + '</p>';
    ul.appendChild(e); return;
  }
  
  var lastDate = null;

  rows.forEach(function(t){
    // 3. Date Grouping
    if (t.tanggal !== lastDate) {
      var hd = document.createElement('li');
      hd.className = 'bg-slate-50/80 px-5 py-2.5 text-[11px] font-bold text-slate-500 tracking-widest border-y border-slate-100';
      hd.textContent = formatGrupTanggal(t.tanggal);
      ul.appendChild(hd);
      lastDate = t.tanggal;
    }

    var li = document.createElement('li');
    li.className = 'p-4 sm:px-5 flex items-center justify-between hover:bg-slate-50/80 transition-colors border-b border-slate-50 last:border-0';
    
    var leftBox = document.createElement('div');
    leftBox.className = 'flex items-center gap-3.5 min-w-0';
    
    var icon = document.createElement('div');
    icon.className = t.jenis === 'masuk' ? 'w-10 h-10 rounded-full flex items-center justify-center bg-emerald-100 text-emerald-600 shrink-0' : 'w-10 h-10 rounded-full flex items-center justify-center bg-rose-100 text-rose-600 shrink-0';
    icon.innerHTML = t.jenis === 'masuk' ? iconMasuk : iconKeluar;
    
    var ket = document.createElement('div'); 
    ket.className = 'flex-1 min-w-0';
    var a = document.createElement('p'); 
    a.className = 'font-semibold text-slate-800 text-sm truncate';
    a.textContent = t.ket;
    var d = document.createElement('p'); 
    d.className = 'text-xs text-slate-500 mt-0.5 truncate';
    d.textContent = t.kategori; // Tanggal dihapus dari sini karena sudah ada di Date Header
    
    ket.appendChild(a); ket.appendChild(d);
    leftBox.appendChild(icon); leftBox.appendChild(ket);
    
    var rightBox = document.createElement('div');
    rightBox.className = 'text-right shrink-0 ml-3';
    
    var j = document.createElement('p');
    j.className = 'font-bold text-sm sm:text-base tracking-tight ' + (t.jenis==='masuk'?'text-emerald-600':'text-rose-600');
    j.textContent = (t.jenis==='masuk'?'+':'−') + rp(t.jumlah);
    rightBox.appendChild(j);
    
    if(loggedIn){
      var ak = document.createElement('div'); 
      ak.className = 'flex gap-3 mt-1.5 justify-end';
      var ed = document.createElement('button'); 
      ed.className = 'text-[11px] font-bold text-blue-600 hover:text-blue-800 uppercase tracking-wider active:scale-90 transition-transform';
      ed.textContent = 'Edit'; 
      ed.onclick = function(){ mulaiEdit(t); };
      var h = document.createElement('button'); 
      h.className = 'text-[11px] font-bold text-rose-600 hover:text-rose-800 uppercase tracking-wider active:scale-90 transition-transform';
      h.textContent = 'Hapus'; 
      h.onclick = function(){
        if(!confirm('Hapus transaksi “' + t.ket + '”?')) return;
        sb.from('kas').delete().eq('id', t.id).then(function(r){
          if(r.error) alert('Gagal menghapus: ' + r.error.message); else load();
        });
      };
      ak.appendChild(ed); ak.appendChild(h); rightBox.appendChild(ak);
    }
    
    li.appendChild(leftBox); li.appendChild(rightBox);
    ul.appendChild(li);
  });
}

function load(){
  if(!$('riwayat').hidden) loadRiwayat();
  Promise.all([
    sb.from('kas').select('*').order('tanggal',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('pengaturan').select('saldo_awal').eq('id',1).maybeSingle()
  ]).then(function(res){
    var r = res[0], p = res[1];
    if(r.error){ data = []; render('Data gagal dimuat. Cek pengaturan Supabase.'); return; }
    data = r.data.map(function(t){ t.kategori = t.kategori || 'Lainnya'; return t; });
    saldoAwal = (p && p.data && p.data.saldo_awal) ? Number(p.data.saldo_awal) : 0;
    renderBulan(); render();
  });
}

function setAuth(session){
  loggedIn = !!session;
  $('boxRiwayat').hidden = !loggedIn;
  if(!loggedIn){ $('riwayat').hidden = true; $('btnRiwayat').textContent = 'Lihat riwayat sistem'; }$('form').hidden = !loggedIn;
  $('btnAwal').hidden = !loggedIn;
  $('loginBox').hidden = true;
  $('btnLogin').textContent = loggedIn ? 'Keluar' : 'Login';
  if(!loggedIn) selesaiEdit();
  render();
}

$('btnLogin').onclick = function(){
  if(loggedIn){
    sb.auth.signOut({ scope: 'local' }).then(function(){ setAuth(null); });
  } else {
    $('loginBox').hidden = !$('loginBox').hidden;
  }
};
$('doLogin').onclick = function(){
  var btn = $('doLogin'); btn.textContent = 'Loading...'; btn.disabled = true;
  sb.auth.signInWithPassword({ email: $('email').value.trim(), password:$('pass').value }).then(function(r){
    btn.textContent = 'Masuk'; btn.disabled = false;
    if(r.error) alert('Login gagal: email atau password salah.'); else $('pass').value = '';
  });
};
sb.auth.onAuthStateChange(function(_e, session){ setAuth(session); });
$('bulan').onchange = function(){ render(); };

function mulaiEdit(t){
  editId = t.id;
  $('jenis').value = t.jenis; isiKategori(t.kategori);
  $('tanggal').value = t.tanggal; $('ket').value = t.ket; $('jumlah').value = ribuan(t.jumlah);$('formTitle').textContent = 'Edit Transaksi';
  $('tambah').textContent = 'Simpan perubahan';$('batal').hidden = false;
  $('form').scrollIntoView({behavior:'smooth', block:'center'});
}
function selesaiEdit(){
  editId = null;
  $('ket').value = ''; $('jumlah').value = '';$('formTitle').textContent = 'Catat Transaksi';
  $('tambah').textContent = 'Tambah transaksi';$('batal').hidden = true;
}
$('batal').onclick = selesaiEdit;

$('tambah').onclick = function(){
  var jumlah = parseInt($('jumlah').value.replace(/\D/g,''), 10), ket =$('ket').value.trim();
  if(!ket || !jumlah || jumlah <= 0 || !$('tanggal').value){ alert('Isi tanggal, keterangan, dan jumlah dulu ya.'); return; }
  var payload = { jenis: $('jenis').value, tanggal: $('tanggal').value, kategori:$('kategori').value, ket: ket, jumlah: jumlah };
  var btn = $('tambah'); btn.disabled = true; btn.textContent = 'Menyimpan...';
  var q = editId ? sb.from('kas').update(payload).eq('id', editId) : sb.from('kas').insert(payload);
  q.then(function(r){
    btn.disabled = false;
    if(r.error){ alert('Gagal menyimpan: ' + r.error.message); btn.textContent = editId ? 'Simpan perubahan' : 'Tambah transaksi'; return; }
    selesaiEdit(); load();
  });
};

$('btnAwal').onclick = function(){
  var v = prompt('Saldo awal kas (Rp):', saldoAwal);
  if(v === null) return;
  var n = parseInt(String(v).replace(/[^\d-]/g,''), 10);
  if(isNaN(n)){ alert('Masukkan angka saja.'); return; }
  sb.from('pengaturan').upsert({ id: 1, saldo_awal: n }).then(function(r){
    if(r.error) alert('Gagal menyimpan: ' + r.error.message); else load();
  });
};

$('export').onclick = function(){
  var rows = filtered().sort(function(a,b){ return a.tanggal.localeCompare(b.tanggal) || a.created_at.localeCompare(b.created_at); });
  var b = $('bulan').value;
  var saldo = b ? saldoSebelum(b) : saldoAwal;
  var aoa = [['Tanggal','Kategori','Keterangan','Pemasukan','Pengeluaran','Saldo']];
  aoa.push(['', '', b ? 'Saldo awal periode' : 'Saldo awal', '', '', saldo]);
  rows.forEach(function(t){
    saldo += t.jenis==='masuk' ? t.jumlah : -t.jumlah;
    aoa.push([t.tanggal, t.kategori, t.ket, t.jenis==='masuk'?t.jumlah:'', t.jenis==='keluar'?t.jumlah:'', saldo]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:12},{wch:22},{wch:36},{wch:14},{wch:14},{wch:14}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Kas');
  XLSX.writeFile(wb, 'kas-' + (b || 'semua') + '.xlsx');
};

function saldoSebelum(ym){
  var s = saldoAwal;
  data.forEach(function(t){ if(t.tanggal.slice(0,7) < ym) s += t.jenis==='masuk' ? t.jumlah : -t.jumlah; });
  return s;
}

function perKategori(rows, jenis){
  var map = {}, total = 0;
  rows.forEach(function(t){ if(t.jenis===jenis){ map[t.kategori] = (map[t.kategori]||0) + t.jumlah; total += t.jumlah; } });
  return { map: map, total: total };
}
