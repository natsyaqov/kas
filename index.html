<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buku Kas RT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f4;--surface:#fff;--ink:#1d2a24;--muted:#6a766f;--line:#dfe4de;--in:#1f7a4d;--out:#b3402f}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--surface:#1c2420;--ink:#e8eee9;--muted:#93a099;--line:#2c3731;--in:#5fcf93;--out:#f08a78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:8px}
h1{font-size:1.1rem;font-weight:600;margin:0;color:var(--muted)}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem;cursor:pointer;padding:0}
.saldo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.saldo .angka{font-size:2.4rem;font-weight:700;letter-spacing:-.02em;margin:0}
.label{color:var(--muted);font-size:.9rem;margin:0}
.ringkas{display:flex;gap:24px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ringkas b{display:block;font-size:1.05rem}
.in{color:var(--in)}.out{color:var(--out)}
.form{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer}
.simpan{padding:12px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600}
.simpan:disabled{opacity:.5}
.batal{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;margin:28px 0 8px;flex-wrap:wrap}
.bar h2{font-size:1rem;margin:0;flex:1;min-width:120px}
.bar select{width:auto;padding:8px 10px}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.ket{flex:1;min-width:0;overflow-wrap:anywhere}
.tgl{font-size:.8rem;color:var(--muted)}
.jml{font-weight:600;white-space:nowrap}
.aksi{display:flex}
.aksi button{border:0;background:none;color:var(--muted);padding:4px 8px}
.kosong{padding:24px 16px;text-align:center;color:var(--muted)}
.login{margin-top:16px;display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
[hidden]{display:none!important}

/* Laporan cetak */
#laporan{display:none;color:#000;background:#fff;font-family:"Segoe UI",system-ui,sans-serif;padding:24px;max-width:720px;margin:0 auto}
#laporan h1{color:#000;font-size:1.4rem;margin:0}
#laporan h3{margin:20px 0 6px;font-size:1rem}
#laporan table{width:100%;border-collapse:collapse;font-size:.9rem}
#laporan td,#laporan th{padding:5px 6px;border-bottom:1px solid #ccc;text-align:left}
#laporan td.r,#laporan th.r{text-align:right}
#laporan .tot td{font-weight:700;border-top:2px solid #000}
#laporan .sub{color:#444;margin:2px 0 0}
@media print{
  body.cetak main{display:none}
  body.cetak #laporan{display:block}
  body.cetak{background:#fff}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 id="judul">Buku Kas RT</h1>
    <button class="link" id="btnLogin">Login bendahara</button>
  </div>

  <section class="saldo" aria-live="polite">
    <p class="label">Saldo kas saat ini</p>
    <p class="angka" id="saldo">Rp0</p>
    <p class="label" id="infoAwal" hidden></p>
    <div class="ringkas">
      <div class="label" id="lblPeriode">Semua periode</div>
      <div>Pemasukan<b class="in" id="totalMasuk">Rp0</b></div>
      <div>Pengeluaran<b class="out" id="totalKeluar">Rp0</b></div>
    </div>
    <p style="margin:12px 0 0"><button class="link" id="btnAwal" hidden>Atur saldo awal</button></p>
  </section>

  <div class="login" id="loginBox" hidden>
    <input id="email" type="email" placeholder="Email bendahara" autocomplete="username">
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="simpan" id="doLogin">Masuk</button>
  </div>

  <div class="form" id="form" hidden>
    <select id="jenis" aria-label="Jenis"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select>
    <input id="tanggal" type="date" aria-label="Tanggal">
    <select class="full" id="kategori" aria-label="Kategori"></select>
    <input class="full" id="ket" type="text" placeholder="Keterangan, misal: Iuran keamanan Pak Budi" aria-label="Keterangan">
    <input class="full" id="jumlah" type="number" min="0" inputmode="numeric" placeholder="Jumlah (Rp)" aria-label="Jumlah">
    <button class="simpan" id="tambah">Tambah transaksi</button>
    <button class="batal" id="batal" hidden>Batal edit</button>
  </div>

  <div class="bar">
    <h2>Riwayat transaksi</h2>
    <select id="bulan" aria-label="Filter bulan"><option value="">Semua bulan</option></select>
    <button class="btn" id="cetak">Laporan</button>
    <button class="btn" id="export">Excel</button>
  </div>
  <ul id="daftar"></ul>
</main>

<section id="laporan"></section>

<script>
// ====== ISI BAGIAN INI ======
var SUPABASE_URL = 'https://jfluvtgiyachbwrbstow.supabase.co';
var SUPABASE_ANON_KEY = 'sb_publishable_rrcjWfQGPCG-mbXwaDt0-w_-CJhKP4H';

var NAMA_RT = 'RT 007 / RW 003';   // contoh: 'RT 05 / RW 02 Perumahan Melati'
// Daftar kategori, boleh diubah sesuka kamu
var KAT = {
  masuk: ['Iuran keamanan','Iuran kebersihan','Kas sosial','Sumbangan','Lainnya'],
  keluar: ['Gaji satpam','Petugas sampah','Listrik & air pos ronda','Santunan warga','Kegiatan warga','Perlengkapan','Lainnya']
};
// ============================

var $ = function(id){ return document.getElementById(id); };
var rp = function(n){ return (n<0?'-':'') + 'Rp' + Math.abs(n).toLocaleString('id-ID'); };
var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var namaBulan = function(ym){ var p = ym.split('-'); return BULAN[+p[1]-1] + ' ' + p[0]; };
var tglIndo = function(s){ return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); };

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var data = [], saldoAwal = 0, loggedIn = false, editId = null;
$('judul').textContent = 'Buku Kas ' + NAMA_RT;
$('tanggal').value = new Date().toISOString().slice(0,10);

function isiKategori(pilih){
  var sel = $('kategori'), list = KAT[$('jenis').value].slice();
  if(pilih && list.indexOf(pilih) < 0) list.push(pilih);
  sel.innerHTML = '';
  list.forEach(function(k){ var o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
  if(pilih) sel.value = pilih;
}
$('jenis').onchange = function(){ isiKategori(); };
isiKategori();

function filtered(){
  var b = $('bulan').value;
  return b ? data.filter(function(t){ return t.tanggal.slice(0,7) === b; }) : data.slice();
}

function renderBulan(){
  var sel = $('bulan'), cur = sel.value, set = {};
  data.forEach(function(t){ set[t.tanggal.slice(0,7)] = 1; });
  var list = Object.keys(set).sort().reverse();
  sel.innerHTML = '<option value="">Semua bulan</option>';
  list.forEach(function(ym){ var o = document.createElement('option'); o.value = ym; o.textContent = namaBulan(ym); sel.appendChild(o); });
  sel.value = list.indexOf(cur) >= 0 ? cur : '';
}

function render(msg){
  var total = saldoAwal;
  data.forEach(function(t){ total += t.jenis==='masuk' ? t.jumlah : -t.jumlah; });
  $('saldo').textContent = rp(total);
  $('infoAwal').hidden = !saldoAwal;
  $('infoAwal').textContent = 'Termasuk saldo awal ' + rp(saldoAwal);

  var rows = filtered(), m = 0, k = 0;
  rows.forEach(function(t){ if(t.jenis==='masuk') m += t.jumlah; else k += t.jumlah; });
  $('totalMasuk').textContent = rp(m);
  $('totalKeluar').textContent = rp(k);
  $('lblPeriode').textContent = $('bulan').value ? namaBulan($('bulan').value) : 'Semua periode';

  var ul = $('daftar'); ul.innerHTML = '';
  if(!rows.length){
    var e = document.createElement('li'); e.className = 'kosong';
    e.textContent = msg || 'Belum ada transaksi.';
    ul.appendChild(e); return;
  }
  rows.forEach(function(t){
    var li = document.createElement('li');
    var ket = document.createElement('div'); ket.className = 'ket';
    var a = document.createElement('div'); a.textContent = t.ket;
    var d = document.createElement('div'); d.className = 'tgl';
    d.textContent = tglIndo(t.tanggal) + ', ' + t.kategori;
    ket.appendChild(a); ket.appendChild(d);
    var j = document.createElement('div');
    j.className = 'jml ' + (t.jenis==='masuk'?'in':'out');
    j.textContent = (t.jenis==='masuk'?'+':'−') + rp(t.jumlah);
    li.appendChild(ket); li.appendChild(j);
    if(loggedIn){
      var ak = document.createElement('div'); ak.className = 'aksi';
      var ed = document.createElement('button'); ed.textContent = 'Edit'; ed.onclick = function(){ mulaiEdit(t); };
      var h = document.createElement('button'); h.textContent = '×'; h.style.fontSize = '1.2rem'; h.setAttribute('aria-label','Hapus transaksi');
      h.onclick = function(){
        if(!confirm('Hapus transaksi “' + t.ket + '”?')) return;
        sb.from('kas').delete().eq('id', t.id).then(function(r){
          if(r.error) alert('Gagal menghapus: ' + r.error.message); else load();
        });
      };
      ak.appendChild(ed); ak.appendChild(h); li.appendChild(ak);
    }
    ul.appendChild(li);
  });
}

function load(){
  Promise.all([
    sb.from('kas').select('*').order('tanggal',{ascending:false}).order('created_at',{ascending:false}),
    sb.from('pengaturan').select('saldo_awal').eq('id',1).maybeSingle()
  ]).then(function(res){
    var r = res[0], p = res[1];
    if(r.error){ data = []; render('Data gagal dimuat. Cek URL dan key Supabase, dan pastikan update-v2.sql sudah dijalankan.'); return; }
    data = r.data.map(function(t){ t.kategori = t.kategori || 'Lainnya'; return t; });
    saldoAwal = (p && p.data && p.data.saldo_awal) ? Number(p.data.saldo_awal) : 0;
    renderBulan(); render();
  });
}

function setAuth(session){
  loggedIn = !!session;
  $('form').hidden = !loggedIn;
  $('btnAwal').hidden = !loggedIn;
  $('loginBox').hidden = true;
  $('btnLogin').textContent = loggedIn ? 'Keluar' : 'Login bendahara';
  if(!loggedIn) selesaiEdit();
  render();
}

$('btnLogin').onclick = function(){
  if(loggedIn){
    sb.auth.signOut({ scope: 'local' }).then(function(){ setAuth(null); });
  } else {
    $('loginBox').hidden = !$('loginBox').hidden;
  }
};
$('doLogin').onclick = function(){
  sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value }).then(function(r){
    if(r.error) alert('Login gagal: email atau password salah.'); else $('pass').value = '';
  });
};
sb.auth.onAuthStateChange(function(_e, session){ setAuth(session); });
$('bulan').onchange = function(){ render(); };

function mulaiEdit(t){
  editId = t.id;
  $('jenis').value = t.jenis; isiKategori(t.kategori);
  $('tanggal').value = t.tanggal; $('ket').value = t.ket; $('jumlah').value = t.jumlah;
  $('tambah').textContent = 'Simpan perubahan'; $('batal').hidden = false;
  $('form').scrollIntoView({behavior:'smooth', block:'center'});
}
function selesaiEdit(){
  editId = null;
  $('ket').value = ''; $('jumlah').value = '';
  $('tambah').textContent = 'Tambah transaksi'; $('batal').hidden = true;
}
$('batal').onclick = selesaiEdit;

$('tambah').onclick = function(){
  var jumlah = parseInt($('jumlah').value, 10), ket = $('ket').value.trim();
  if(!ket || !jumlah || jumlah <= 0 || !$('tanggal').value){ alert('Isi tanggal, keterangan, dan jumlah dulu ya.'); return; }
  var payload = { jenis: $('jenis').value, tanggal: $('tanggal').value, kategori: $('kategori').value, ket: ket, jumlah: jumlah };
  var btn = $('tambah'); btn.disabled = true;
  var q = editId ? sb.from('kas').update(payload).eq('id', editId) : sb.from('kas').insert(payload);
  q.then(function(r){
    btn.disabled = false;
    if(r.error){ alert('Gagal menyimpan: ' + r.error.message); return; }
    selesaiEdit(); load();
  });
};

$('btnAwal').onclick = function(){
  var v = prompt('Saldo awal kas (Rp), yaitu uang kas sebelum mulai dicatat di web ini:', saldoAwal);
  if(v === null) return;
  var n = parseInt(String(v).replace(/[^\d-]/g,''), 10);
  if(isNaN(n)){ alert('Masukkan angka saja, misalnya 1500000.'); return; }
  sb.from('pengaturan').upsert({ id: 1, saldo_awal: n }).then(function(r){
    if(r.error) alert('Gagal menyimpan saldo awal: ' + r.error.message); else load();
  });
};

$('export').onclick = function(){
  var rows = filtered().sort(function(a,b){ return a.tanggal.localeCompare(b.tanggal) || a.created_at.localeCompare(b.created_at); });
  var b = $('bulan').value;
  var saldo = b ? saldoSebelum(b) : saldoAwal;
  var aoa = [['Tanggal','Kategori','Keterangan','Pemasukan','Pengeluaran','Saldo']];
  aoa.push(['', '', b ? 'Saldo awal periode' : 'Saldo awal', '', '', saldo]);
  rows.forEach(function(t){
    saldo += t.jenis==='masuk' ? t.jumlah : -t.jumlah;
    aoa.push([t.tanggal, t.kategori, t.ket, t.jenis==='masuk'?t.jumlah:'', t.jenis==='keluar'?t.jumlah:'', saldo]);
  });
  var ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch:12},{wch:22},{wch:36},{wch:14},{wch:14},{wch:14}];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Kas');
  XLSX.writeFile(wb, 'kas-' + (b || 'semua') + '.xlsx');
};

// Saldo di awal bulan tertentu = saldo awal + semua transaksi sebelum bulan itu
function saldoSebelum(ym){
  var s = saldoAwal;
  data.forEach(function(t){ if(t.tanggal.slice(0,7) < ym) s += t.jenis==='masuk' ? t.jumlah : -t.jumlah; });
  return s;
}

function perKategori(rows, jenis){
  var map = {}, total = 0;
  rows.forEach(function(t){ if(t.jenis===jenis){ map[t.kategori] = (map[t.kategori]||0) + t.jumlah; total += t.jumlah; } });
  return { map: map, total: total };
}

$('cetak').onclick = function(){
  var ym = $('bulan').value;
  if(!ym){ alert('Pilih bulan dulu di filter, lalu klik Laporan.'); return; }
  var rows = filtered().sort(function(a,b){ return a.tanggal.localeCompare(b.tanggal) || a.created_at.localeCompare(b.created_at); });
  var awal = saldoSebelum(ym), pm = perKategori(rows,'masuk'), pk = perKategori(rows,'keluar');
  var akhir = awal + pm.total - pk.total;

  function tabel(judul, o){
    var h = '<h3>' + judul + '</h3><table>';
    var keys = Object.keys(o.map);
    if(!keys.length) h += '<tr><td>Tidak ada</td><td class="r">Rp0</td></tr>';
    keys.forEach(function(k){ h += '<tr><td>' + esc(k) + '</td><td class="r">' + rp(o.map[k]) + '</td></tr>'; });
    return h + '<tr class="tot"><td>Total</td><td class="r">' + rp(o.total) + '</td></tr></table>';
  }
  var h = '<h1>Laporan Kas ' + esc(NAMA_RT) + '</h1><p class="sub">Periode ' + namaBulan(ym) + '</p>';
  h += '<h3>Ringkasan</h3><table>' +
       '<tr><td>Saldo awal bulan</td><td class="r">' + rp(awal) + '</td></tr>' +
       '<tr><td>Total pemasukan</td><td class="r">' + rp(pm.total) + '</td></tr>' +
       '<tr><td>Total pengeluaran</td><td class="r">' + rp(pk.total) + '</td></tr>' +
       '<tr class="tot"><td>Saldo akhir bulan</td><td class="r">' + rp(akhir) + '</td></tr></table>';
  h += tabel('Pemasukan per kategori', pm) + tabel('Pengeluaran per kategori', pk);
  h += '<h3>Rincian transaksi</h3><table><tr><th>Tanggal</th><th>Keterangan</th><th class="r">Pemasukan</th><th class="r">Pengeluaran</th></tr>';
  rows.forEach(function(t){
    h += '<tr><td>' + tglIndo(t.tanggal) + '</td><td>' + esc(t.ket) + ' (' + esc(t.kategori) + ')</td>' +
         '<td class="r">' + (t.jenis==='masuk' ? rp(t.jumlah) : '') + '</td>' +
         '<td class="r">' + (t.jenis==='keluar' ? rp(t.jumlah) : '') + '</td></tr>';
  });
  h += '</table><p class="sub" style="margin-top:28px">Dicetak ' + tglIndo(new Date().toISOString().slice(0,10)) + '</p>';
  $('laporan').innerHTML = h;
  document.body.classList.add('cetak');
  window.print();
};
window.addEventListener('afterprint', function(){ document.body.classList.remove('cetak'); });

load();
setInterval(load, 30000);
</script>
</body>
</html>
